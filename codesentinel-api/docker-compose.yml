services:
  api:
    build:
      context: ..
      dockerfile: codesentinel-api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://codesentinel:codesentinel@db:5432/codesentinel
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codesentinel
      POSTGRES_USER: codesentinel
      POSTGRES_PASSWORD: codesentinel
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesentinel -d codesentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: ../codesentinel-frontend
      dockerfile: Dockerfile
    ports: ["3000:80"]
    depends_on:
      - api
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
volumes:
  postgres_data:
